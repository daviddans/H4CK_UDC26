services:
  opensearch-node:
    image: opensearchproject/opensearch:latest
    container_name: opensearch-node
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=ComplexPassword123!"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - 9200:9200
    networks:
      - opensearch-net
   
  backend:
    build: backend
    container_name: backend-node
    ports:
      - "8000:8000"
    depends_on:
      - opensearch-node
    networks:
      - opensearch-net  
      - frontend-net

  frontend:
    build: docfinder-front
    container_name: frontend-node
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - frontend-net


volumes:
  opensearch-data:

networks:
  opensearch-net:
    driver: bridge
  frontend-net:
    driver: bridge
